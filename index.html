    <style>
      *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4ece5;color:#2c2926;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#fbe9e3 0,transparent 35%),radial-gradient(circle at 90% 80%,#e4ecdf 0,transparent 38%),#f4ece5}.card{width:min(92vw,460px);padding:38px 30px;border:1px solid #e8dfd8;border-radius:32px;background:#fffdfb;box-shadow:0 20px 50px rgba(87,61,44,.12);text-align:center}.brand{font-family:Georgia,serif;font-size:52px;font-weight:700;letter-spacing:-3px;line-height:1}.heart{font-size:22px;color:#d9868b;margin-bottom:15px}.card h1{font-family:Georgia,serif;font-size:28px;line-height:1.12;margin:28px 0 12px}.card p{color:#7c746f;line-height:1.6;margin:0}.status{display:inline-flex;margin-top:24px;padding:9px 14px;border-radius:999px;background:#eef3ea;color:#5f7f63;font-size:13px;font-weight:700}

    <main><section class="card"><div class="heart">♡</div><div class="brand">together.</div><h1>Hai cuộc sống khác nhau.<br/>Một nhịp chung.</h1><p>Bản ứng dụng đang được build trực tiếp từ main. Trang này sẽ tự được thay bằng bản production sau khi GitHub Actions hoàn tất.</p><span class="status">Đang xuất bản bản mới…</span></section></main>
