name: Build and Publish Together

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: together-production
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://jirbjekrevydrqytvfee.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OPr4RWRxVhw67bxf3sjp7A_oL7zAqKD

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run scheduling regression tests
        run: npm run test:logic
      - name: Validate email authentication behavior
        run: npm run test:auth
      - name: Validate app session and request races
        run: node scripts/test-app-races.mjs
      - name: Install isolated PostgreSQL test runtime
        run: npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Validate RLS, couple membership and plan lifecycle
        run: node scripts/test-backend.mjs
      - name: Typecheck and build production app
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish compiled app into main/root and main/docs
        run: |
          rm -rf assets docs
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          cp dist/manifest.webmanifest ./manifest.webmanifest
          for icon in icon.svg favicon.png apple-touch-icon.png icon-192.png icon-512.png icon-192-maskable.png icon-512-maskable.png; do
            test -f "dist/$icon"
            cp "dist/$icon" "./$icon"
          done
          touch .nojekyll
          mkdir -p docs
          cp -R dist/* docs/
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets icon.svg favicon.png apple-touch-icon.png icon-192.png icon-512.png icon-192-maskable.png icon-512-maskable.png manifest.webmanifest .nojekyll docs
          if git diff --cached --quiet; then
            echo "Compiled web output already current."
          else
            git commit -m "chore: publish Together web build [skip ci]"
            git push origin HEAD:main
          fi

  deploy-pages-actions:
    if: github.actor != 'github-actions[bot]'
    needs: build-and-publish
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy when repository uses GitHub Actions Pages
        id: deployment
        uses: actions/deploy-pages@v4
